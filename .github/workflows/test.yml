name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bash bats-core
          # Make homebrew bash accessible
          sudo ln -sf /opt/homebrew/bin/bash /usr/local/bin/bash
          echo "/usr/local/bin" >> $GITHUB_PATH
      
      - name: Check bash version
        run: |
          which bash
          bash --version | head -1
          /usr/bin/env bash --version | head -1
      
      - name: Run bats tests
        run: |
          bats tests/test_ip_counter.bats
      
      - name: Test installation
        run: |
          make install PREFIX=/tmp/test-install
          /tmp/test-install/bin/ip_counter --help
