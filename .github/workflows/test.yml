name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      
      - name: Run bats tests
        run: |
          bats tests/test_ip_counter.bats
      
      - name: Test installation
        run: |
          make install PREFIX=/tmp/test-install
          /tmp/test-install/bin/ip_counter --help
